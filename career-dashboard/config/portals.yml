search_queries:
  - name: "Data Analyst Ireland"
    query: '"Data Analyst" Ireland'
    track: "analytics"
    enabled: true
  - name: "BI Analyst Ireland"
    query: '"BI Analyst" OR "Business Intelligence Analyst" Ireland'
    track: "analytics"
    enabled: true
  - name: "Power BI Ireland"
    query: '"Power BI Developer" OR "BI Developer" OR "Reporting Analyst" Ireland'
    track: "bi-delivery"
    enabled: true
  - name: "Insights and Reporting Ireland"
    query: '"Insights Analyst" OR "Reporting Analyst" Ireland SQL'
    track: "analytics"
    enabled: true
  - name: "Graduate Data Scientist Ireland"
    query: '"Graduate Data Scientist" OR "Junior Data Scientist" Ireland'
    track: "applied-data-science"
    enabled: true
  - name: "Entry-level GenAI Applications Ireland"
    query: '("GenAI Application Developer" OR "AI Application Developer" OR "RAG Developer") Ireland junior'
    track: "genai-project"
    enabled: true
  - name: "Ireland Analytics ATS"
    query: '("Data Analyst" OR "BI Analyst" OR "Power BI") Ireland (site:boards.greenhouse.io OR site:jobs.lever.co OR site:jobs.ashbyhq.com)'
    track: "analytics"
    enabled: true

title_filter:
  eligible_phrases:
    - "Data Analyst"
    - "BI Analyst"
    - "Business Intelligence Analyst"
    - "Analytics Analyst"
    - "Insights Analyst"
    - "Reporting Analyst"
    - "BI Developer"
    - "Business Intelligence Developer"
    - "Power BI Developer"
    - "Junior Data Scientist"
    - "Graduate Data Scientist"
    - "Data Scientist"
  conditional_phrases:
    - "Business Analyst"
    - "Commercial Analyst"
    - "Operations Analyst"
    - "Finance Analyst"
    - "GenAI Application Developer"
    - "AI Application Developer"
  conditional_description_signals:
    - "Power BI"
    - "SQL"
    - "Tableau"
    - "dashboard"
    - "reporting"
    - "data visualization"
    - "business intelligence"
    - "RAG"
    - "FAISS"
    - "Streamlit"
    - "candidate projects"
  excluded_phrases:
    - "AI Engineer"
    - "Artificial Intelligence Engineer"
    - "Machine Learning Engineer"
    - "ML Engineer"
    - "MLOps"
    - "Software Engineer"
    - "Full Stack"
    - "Full-Stack"
    - "DevOps"
    - "Data Engineer"
    - "Analytics Engineer"
    - "Hardware"
    - "Embedded"
    - "Principal"
    - "Director"
    - "Vice President"
    - "VP"
  seniority_preferred:
    - "Junior"
    - "Graduate"
    - "Associate"
    - "Entry Level"
  seniority_manual_review:
    - "Senior"
    - "Lead"
    - "Manager"

role_gate:
  data_scientist: "Accept only junior, graduate, or clearly entry-level roles that permit academic project evidence."
  business_analyst: "Accept only when the description has substantial data, BI, dashboard, SQL, or reporting duties."
  engineer_titles: "Reject. Do not infer fit from Python, SQL, data, analytics, or cloud keyword overlap."

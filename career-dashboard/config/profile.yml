project_selection:
  registry: context/evidence.yml
  exactly_one_selected_project: true
  allow_only_resume_ready_projects: true
  current_problem_sources:
  - Verified job-description snapshot
  - Target employer official website
  - Target employer official newsroom or filing
  - Target employer engineering or product documentation
  ranking_weights:
    problem_similarity: 35
    required_skill_evidence: 30
    evidence_strength: 20
    domain_and_stakeholder_similarity: 10
    recency: 5
  safeguards:
  - Company research ranks real projects; it never creates candidate experience.
  - Keep the original project identity, evidence type, ownership, and completion status.
  - Do not imply the project was built for the target employer.
  - If no project is a strong analogue, disclose the gap and select the closest honest
    evidence.
ten_company_request:
  trigger_examples:
  - give me 10 companies
  - find 10 matching companies
  - make 10 tailored resumes
  default_scope: End-to-end discovery, verification, ranking, tailoring, compilation,
    visual QA, and delivery; not list-only.
  target_release_count: 10
  discovery_rule: Continue replacing rejected, duplicate, expired, or inaccessible
    leads until ten distinct eligible live JDs are secured or the honest market search
    is exhausted.
  deliverables:
  - Ranked table of company, role, location, posting URL, fit decision, supported
    requirement coverage, and key gap
  - Ten isolated two-page tailored resume artifact folders when ten eligible JDs are
    available
  - Direct paths to every released resume PDF and job folder
  application_rule: Never submit an application or send outreach without explicit
    authorization.
resume_contract:
  template: templates/resume-base.tex
  paper: A4
  layout: single_column
  required_pages: 2
  minimum_body_font_pt: 10
  required_sections:
  - Professional Summary
  - Core Skills
  - Professional Experience
  - Selected Project
  - Education
  - Certifications
  - Technical Skills
  prohibited_filler:
  - References available upon request
  - Generic objective statements
  - Unsupported extracurriculars
  - Duplicate notable-outcomes section
  diagnostics:
    job_fit_score: Opportunity decision only
    supported_requirement_coverage: Required/preferred JD requirements backed by evidence
      IDs
    artifact_qa: Binary hard gates; never averaged into a score
  release_command: python3 scripts/validate_resume.py <resume.tex> --compile --output
    <resume.pdf> --render-dir <resume-preview> --qa-json <qa.json>
batch_contract:
  maximum_jobs: 10
  isolated_job_folders: true
  retry_limit: 3
  required_artifacts:
  - job-description.md
  - evaluation.md
  - company-research.md
  - evidence-map.yml
  - resume.tex
  - resume.pdf
  - resume-preview/page-01.png
  - resume-preview/page-02.png
  - qa.json
  cross_batch_invariants:
  - identity
  - contact details
  - employment titles and dates
  - education status and dates
  - metrics and attribution
  discovery_replacement_policy: Rejected/expired/duplicate leads do not consume the
    requested release count; continue searching for replacements where possible.

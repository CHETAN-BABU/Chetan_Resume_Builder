- id: PROJ-MSC-FRAUD
  canonical_name: Machine Learning-Based Medical Insurance Fraud Prediction
  external_name: Medical Insurance Claim Fraud Detection - MSc Capstone
  evidence_type: academic
  status: conditional
  ownership: MSc capstone; individual/team status not explicitly supplied
  date_context: Within the Sep 2025-Sep 2026 MSc period; submission month/year and final grade not supplied
  source_refs:
  - context/sources/career.md > Thesis - in progress
  - context/sources/masters-projects.md > CAPSTONE PROJECT - Machine Learning-Based Medical Insurance
    Claim Fraud Detection
  - context/sources/portfolio-audit.md > Project 1 - Main MSc capstone
  approved_external_use: Only for junior/graduate data-science or directly relevant analytics roles.
  problem_patterns:
  - fraud analytics
  - insurance risk
  - healthcare analytics
  - classification
  - imbalanced learning
  - explainable AI
  - threshold optimization
  role_tracks:
  - Junior Data Scientist
  - Graduate Data Scientist
  - Data Analyst
  technologies:
  - Random Forest
  - XGBoost
  - LightGBM
  - Logistic Regression
  - Gradient Boosting
  - SMOTE
  - GridSearchCV
  - SHAP
  - PCA
  approved_facts:
  - Built a supervised-learning workflow over a public synthetic dataset of 10,000 medical insurance claims,
    with an independent 2,000-record test set.
  - Engineered Claim Discrepancy and Delay Rate, compared five classifiers, and used a stratified 60:20:20
    split with training-only SMOTE and a leakage-safe cross-validation pipeline.
  - Tuned LightGBM with GridSearchCV and selected a 0.25 probability threshold on validation data to improve
    fraud recall while explicitly accepting more false positives.
  - At the selected threshold, the independent test results were 60.3% fraud recall, 16.3% precision,
    25.6% F1, 0.535 ROC-AUC, and 0.173 PR-AUC; the analysis concludes that discrimination is limited and
    not production-ready.
  - Applied permutation importance and SHAP for global and claim-level interpretation.
  - The MSc award remains in progress; final submission date and grade are not supplied.
  resume_content:
    title: Medical Insurance Claim Fraud Detection
    context: MSc capstone | Python, scikit-learn, LightGBM, SMOTE, GridSearchCV, SHAP
    bullets:

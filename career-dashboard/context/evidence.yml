    - Compared three learning rates across 200 epochs, diagnosing slow convergence and overshooting; 0.05
      provided the strongest speed/stability balance.
    - Achieved silhouette 0.814 with DBSCAN on Gaussian data and documented how epsilon selection fragmented
      the non-convex ring rather than overstating the result.
  prohibited:
